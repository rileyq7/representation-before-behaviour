[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "representation-before-behaviour"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.6", "transformers>=4.50", "numpy", "scipy", "scikit-learn", "matplotlib", "huggingface-hub", "accelerate"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
